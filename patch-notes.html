<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deadlock パッチノート翻訳 | 日本語ファンサイト</title>
  <meta name="description" content="Deadlockの最新パッチノートを日本語に翻訳して掲載しています。3月25日パッチ対応。" />
  <link rel="canonical" href="https://main.doj0zmgee527y.amplifyapp.com/patch-notes.html" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://main.doj0zmgee527y.amplifyapp.com/patch-notes.html" />
  <meta property="og:title" content="Deadlock パッチノート翻訳 | 日本語ファンサイト" />
  <meta property="og:description" content="Deadlockの最新パッチノートを日本語に翻訳して掲載しています。3月25日パッチ対応。" />
  <meta property="og:site_name" content="Deadlock Fan Site" />
  <meta property="og:locale" content="ja_JP" />
  <style>
    :root {
      --bg: #0b0d10;
      --panel: rgba(255,255,255,0.06);
      --panel-strong: rgba(255,255,255,0.1);
      --text: #f5f7fa;
      --muted: #aab3c2;
      --accent: #ffb84d;
      --line: rgba(255,255,255,0.12);
      --shadow: 0 20px 50px rgba(0,0,0,0.35);
      --radius: 22px;
      --max: 1180px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255,184,77,0.12), transparent 28%),
        radial-gradient(circle at top right, rgba(110,168,254,0.10), transparent 20%),
        linear-gradient(180deg, #0b0d10 0%, #10141a 100%);
      color: var(--text);
      line-height: 1.65;
    }

    a { color: inherit; }

    .container {
      width: min(calc(100% - 32px), var(--max));
      margin: 0 auto;
    }

    /* ナビゲーション */
    .site-nav {
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid var(--line);
      padding: 0 clamp(1rem, 4vw, 3rem);
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .site-nav a {
      color: var(--muted);
      text-decoration: none;
      padding: 1rem 1.25rem;
      font-size: 0.9rem;
      border-bottom: 2px solid transparent;
      transition: color .2s, border-color .2s;
    }

    .site-nav a:hover,
    .site-nav a.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ヘッダー */
    .hero {
      padding: 72px 0 30px;
    }

    .eyebrow {
      display: inline-block;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,0.04);
      font-size: 0.88rem;
      letter-spacing: 0.02em;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .lead {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 60ch;
    }

    /* セクション */
    .section {
      padding: 18px 0 60px;
    }

    .section-title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 24px;
    }

    .section-title h2 {
      margin: 0;
      font-size: clamp(1.4rem, 3vw, 2rem);
      letter-spacing: -0.02em;
    }

    .section-title p {
      margin: 0;
      color: var(--muted);
      max-width: 54ch;
      text-align: right;
    }

    /* パッチノート エントリ */
    .patch-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .patch-entry {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .patch-entry h3 {
      margin: 0 0 10px;
      font-size: 1.1rem;
      color: var(--accent);
      letter-spacing: -0.01em;
    }

    .patch-entry ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .patch-entry li {
      color: var(--muted);
      font-size: 0.96rem;
    }

    .patch-entry li::before {
      content: "▸ ";
      color: var(--accent);
    }

    /* 過去パッチ 日付タブ */
    .patch-date-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .patch-tab-btn {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      padding: 6px 16px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: border-color .2s, color .2s;
      font-family: inherit;
    }

    .patch-tab-btn:hover,
    .patch-tab-btn.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* フッター */
    footer {
      padding: 10px 0 42px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .footer-box {
      border-top: 1px solid var(--line);
      padding-top: 18px;
    }

    @media (max-width: 900px) {
      .section-title {
        display: block;
      }

      .section-title p {
        text-align: left;
        margin-top: 8px;
      }
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a href="index.html">ホーム</a>
    <a href="tier-list.html">ヒーロー Tier List</a>
    <a href="patch-notes.html" class="active">パッチノート翻訳</a>
  </nav>

  <header class="hero">
    <div class="container">
      <div class="eyebrow">Deadlock Fan Site / パッチノート翻訳</div>
      <h1>パッチノート<br>日本語翻訳</h1>
      <p class="lead">
        Deadlockの最新パッチノートを日本語に翻訳して掲載しています。
        翻訳元: patchbot.io/games/deadlock
      </p>
    </div>
  </header>

  <main>
    <!-- 最新パッチ（常に表示） -->
    <section class="section">
      <div class="container">
        <div class="section-title">
          <h2 id="latest-patch-title">最新パッチ</h2>
        </div>
        <div id="latest-patch-list" class="patch-list">
          <div class="patch-entry" style="color:var(--muted)">読み込み中...</div>
        </div>
      </div>
    </section>

    <!-- 過去のパッチ（2件以上あるときのみ表示） -->
    <section class="section" id="archive-section" style="display:none; padding-top:0;">
      <div class="container">
        <div class="section-title">
          <h2>過去のパッチノート</h2>
        </div>
        <div class="patch-date-tabs" id="patch-tabs"></div>
        <div id="archive-patch-list" class="patch-list"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container footer-box">
      非公式ファンサイト。DeadlockはValve Corporationの商標です。
    </div>
  </footer>

  <script>
    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function renderPatch(data) {
      return data.heroes.map(hero => `
        <div class="patch-entry">
          <h3>${escHtml(hero.name)}</h3>
          <ul>
            ${hero.changes.map(c => `<li>${escHtml(c)}</li>`).join('')}
          </ul>
        </div>
      `).join('');
    }

    async function loadPatch(date) {
      const res = await fetch(`./data/patches/${date}.json`);
      return res.json();
    }

    async function init() {
      const indexRes = await fetch('./data/patches/index.json');
      const dates = await indexRes.json();

      // 最新パッチを表示
      const latest = await loadPatch(dates[0]);
      document.getElementById('latest-patch-title').textContent = latest.label;
      document.getElementById('latest-patch-list').innerHTML = renderPatch(latest);

      // 過去パッチ（2件目以降）
      const archiveDates = dates.slice(1);
      if (archiveDates.length === 0) return;

      document.getElementById('archive-section').style.display = '';

      const tabsEl = document.getElementById('patch-tabs');
      const listEl = document.getElementById('archive-patch-list');

      async function showArchive(date, btn) {
        document.querySelectorAll('.patch-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        listEl.innerHTML = '<div class="patch-entry" style="color:var(--muted)">読み込み中...</div>';
        const data = await loadPatch(date);
        listEl.innerHTML = renderPatch(data);
      }

      archiveDates.forEach((date, i) => {
        const btn = document.createElement('button');
        btn.className = 'patch-tab-btn';
        // YYYY-MM-DD → M月D日 表示
        const [, m, d] = date.split('-');
        btn.textContent = `${parseInt(m)}月${parseInt(d)}日パッチ`;
        btn.addEventListener('click', () => showArchive(date, btn));
        tabsEl.appendChild(btn);
        if (i === 0) showArchive(date, btn);
      });
    }

    init();
  </script>
</body>
</html>
