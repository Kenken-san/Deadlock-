name: Post Latest Patch to X

on:
  push:
    branches:
      - main
    paths:
      - 'data/patches/**'
  workflow_dispatch:      # 手動実行（初回投稿はこれで発火）

permissions:
  contents: write          # last-tweeted.txt をコミットし返すため

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Post to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node scripts/post-to-x.js

      - name: Record tweeted patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last-tweeted.txt
          # 変更があるときだけコミット（[skip ci] で他ワークフローの再実行を防止）
          git diff --staged --quiet || (git commit -m "chore: X投稿済み記録を更新 [skip ci]" && git push)
