<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deadlock Hero Tier List</title>
  <meta name="description" content="Deadlockのヒーローティアリストを掲載するシンプルなファンサイト" />
  <style>
    :root {
      --bg: #0b0d10;
      --panel: rgba(255,255,255,0.06);
      --panel-strong: rgba(255,255,255,0.1);
      --text: #f5f7fa;
      --muted: #aab3c2;
      --accent: #ffb84d;
      --line: rgba(255,255,255,0.12);
      --shadow: 0 20px 50px rgba(0,0,0,0.35);
      --radius: 22px;
      --max: 1180px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255,184,77,0.12), transparent 28%),
        radial-gradient(circle at top right, rgba(110,168,254,0.10), transparent 20%),
        linear-gradient(180deg, #0b0d10 0%, #10141a 100%);
      color: var(--text);
      line-height: 1.65;
    }

    a { color: inherit; }

    .container {
      width: min(calc(100% - 32px), var(--max));
      margin: 0 auto;
    }

    .hero {
      padding: 72px 0 30px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 28px;
      align-items: center;
    }

    .eyebrow {
      display: inline-block;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,0.04);
      font-size: 0.88rem;
      letter-spacing: 0.02em;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .lead {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 60ch;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 26px;
    }

    .meta-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      min-width: 150px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .meta-card strong {
      display: block;
      font-size: 1.1rem;
      margin-bottom: 2px;
    }

    .meta-card span {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .hero-panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .section {
      padding: 18px 0 60px;
    }

    .section-title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .section-title h2 {
      margin: 0;
      font-size: clamp(1.4rem, 3vw, 2rem);
      letter-spacing: -0.02em;
    }

    .section-title p {
      margin: 0;
      color: var(--muted);
      max-width: 54ch;
      text-align: right;
    }

    .image-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .image-card img {
      display: block;
      width: 100%;
      height: auto;
      background: #000;
    }

    .image-caption {
      padding: 16px 18px;
      color: var(--muted);
      font-size: 0.94rem;
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
    }

    .cards {
      margin-top: 22px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 1.05rem;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.96rem;
    }

    footer {
      padding: 10px 0 42px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .footer-box {
      border-top: 1px solid var(--line);
      padding-top: 18px;
    }

    @media (max-width: 900px) {
      .hero-grid {
        grid-template-columns: 1fr;
      }

      .section-title {
        display: block;
      }

      .section-title p {
        text-align: left;
        margin-top: 8px;
      }

      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="container hero-grid">
      <div>
        <div class="eyebrow">Deadlock Fan Site / Hero Tier List</div>
        <h1>Deadlock<br>Hero Tier List</h1>
        <p class="lead">
          まずはヒーローティアリストをメインコンテンツとして公開するための、
          シンプルで見やすい1ページ構成にしました。あとからビルド解説、
          パッチノート、初心者向けガイドを追加していきます。
        </p>
        
      </div>
      <div class="hero-panel">
        <div style="color: var(--muted); font-size: 0.95rem; margin-bottom: 8px;">Featured</div>
        <div style="font-size: 1.25rem; font-weight: 700; margin-bottom: 8px;">最新ヒーロー評価</div>
        <div style="color: var(--muted);">
          ヒーローの勝率データから作りました。
        </div>
      </div>
    </div>
  </header>
