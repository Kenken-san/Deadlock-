<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deadlockers | Deadlock 日本語ファンサイト</title>
  <meta name="description" content="Deadlockのヒーロー情報・Tier List・パッチノート日本語翻訳を提供する非公式ファンサイト" />
  <link rel="canonical" href="https://deadlock-jp.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://deadlock-jp.com/" />
  <meta property="og:title" content="Deadlockers | 日本語ファンサイト" />
  <meta property="og:description" content="Deadlockのヒーロー評価ランキングと最新パッチノート日本語翻訳を掲載" />
  <meta property="og:site_name" content="Deadlock Fan Site" />
  <meta property="og:locale" content="ja_JP" />
  <style>
    :root {
      --bg: #0b0d10;
      --panel: rgba(255,255,255,0.06);
      --panel-strong: rgba(255,255,255,0.1);
      --text: #f5f7fa;
      --muted: #aab3c2;
      --accent: #ffb84d;
      --line: rgba(255,255,255,0.12);
      --shadow: 0 20px 50px rgba(0,0,0,0.35);
      --radius: 22px;
      --max: 1180px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255,184,77,0.12), transparent 28%),
        radial-gradient(circle at top right, rgba(110,168,254,0.10), transparent 20%),
        linear-gradient(180deg, #0b0d10 0%, #10141a 100%);
      color: var(--text);
      line-height: 1.65;
    }

    a { color: inherit; }

    .container {
      width: min(calc(100% - 32px), var(--max));
      margin: 0 auto;
    }

    /* ナビゲーション */
    .site-nav {
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid var(--line);
      padding: 0 clamp(1rem, 4vw, 3rem);
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .site-nav a {
      color: var(--muted);
      text-decoration: none;
      padding: 1rem 1.25rem;
      font-size: 0.9rem;
      border-bottom: 2px solid transparent;
      transition: color .2s, border-color .2s;
    }

    .site-nav a:hover,
    .site-nav a.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ヒーローヘッダー */
    .hero {
      padding: 80px 0 60px;
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,0.04);
      font-size: 0.88rem;
      letter-spacing: 0.02em;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.8rem, 7vw, 5rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    h1 span {
      color: var(--accent);
    }

    .lead {
      margin: 0 auto 40px;
      color: var(--muted);
      font-size: 1.1rem;
      max-width: 52ch;
    }

    /* フィーチャーカード */
    .section {
      padding: 0 0 80px;
    }

    .section-heading {
      font-size: clamp(1.2rem, 2.5vw, 1.6rem);
      letter-spacing: -0.02em;
      margin: 0 0 24px;
      color: var(--muted);
      font-weight: 500;
    }

    .feature-cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .feature-card {
      display: flex;
      align-items: center;
      gap: 1.4rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 2rem 2rem 2rem 1.8rem;
      text-decoration: none;
      color: var(--text);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      transition: transform .2s, border-color .2s, background .2s;
    }

    .feature-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      background: rgba(255,255,255,0.09);
    }

    .feature-card-icon {
      font-size: 2.6rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .feature-card-body {
      flex: 1;
    }

    .feature-card-body h3 {
      margin: 0 0 6px;
      font-size: 1.2rem;
      letter-spacing: -0.01em;
    }

    .feature-card-body p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .feature-card-arrow {
      margin-left: auto;
      font-size: 1.4rem;
      color: var(--accent);
      flex-shrink: 0;
      transition: transform .2s;
    }

    .feature-card:hover .feature-card-arrow {
      transform: translateX(5px);
    }

    /* フッター */
    footer {
      padding: 10px 0 42px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .footer-box {
      border-top: 1px solid var(--line);
      padding-top: 18px;
    }

    @media (max-width: 640px) {
      .feature-cards {
        grid-template-columns: 1fr;
      }

      .hero {
        padding: 60px 0 40px;
      }
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a href="index.html" class="active">ホーム</a>
    <a href="tier-list.html">ヒーロー Tier List</a>
    <a href="patch-notes.html">パッチノート翻訳</a>
  </nav>

  <header class="hero">
    <div class="container">
      <div class="eyebrow">非公式ファンサイト / Unofficial Fan Site</div>
      <h1>Dead<span>lockers</span></h1>
      <p class="lead">
        Deadlockのヒーロー情報・Tier List・パッチノート日本語翻訳を提供するファンサイトです。
      </p>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <p class="section-heading">コンテンツ</p>
        <div class="feature-cards">

          <a class="feature-card" href="tier-list.html">
            <div class="feature-card-icon">📊</div>
            <div class="feature-card-body">
              <h3>ヒーロー Tier List</h3>
              <p>最新パッチに基づくヒーロー評価ランキング</p>
            </div>
            <span class="feature-card-arrow">→</span>
          </a>

          <a class="feature-card" href="patch-notes.html">
            <div class="feature-card-icon">📋</div>
            <div class="feature-card-body">
              <h3>パッチノート翻訳</h3>
              <p>最新パッチの変更内容を日本語で解説</p>
            </div>
            <span class="feature-card-arrow">→</span>
          </a>

        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container footer-box">
      非公式ファンサイト。DeadlockはValve Corporationの商標です。
    </div>
  </footer>
</body>
</html>
